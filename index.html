<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wingfoil Setup Advisor</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-p-4 pb-12">
    <div class="max-w-md mx-auto p-4">
        <header class="text-center my-6">
            <h1 class="text-2xl font-black text-sky-400 tracking-wider">WINGFOIL ADVISOR</h1>
            <p class="text-xs text-slate-400">¿Qué material monto hoy?</p>
        </header>

        <main class="space-y-6 bg-slate-800 p-5 rounded-2xl shadow-xl border border-slate-700">
            <!-- Datos del Rider -->
            <section class="space-y-3">
                <h2 class="text-sm font-bold text-sky-300 uppercase tracking-wide">1. Perfil del Rider</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Peso (kg)</label>
                        <input type="number" id="peso" value="85" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white font-bold focus:outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Nivel</label>
                        <select id="nivel" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white font-bold focus:outline-none focus:border-sky-500">
                            <option value="basico">Básico</option>
                            <option value="intermedio">Intermedio</option>
                            <option value="avanzado" selected>Avanzado</option>
                            <option value="experto">Experto</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- Datos del Spot y Previsión -->
            <section class="space-y-3">
                <h2 class="text-sm font-bold text-sky-300 uppercase tracking-wide">2. Spot y Previsión</h2>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Nombre del Spot</label>
                    <input type="text" id="spot" placeholder="Ej. Cortadura, Valdelagrana..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-sky-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Viento Medio (nudos)</label>
                        <input type="number" id="nudosMedios" placeholder="Ej. 18" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Rachas (nudos)</label>
                        <input type="number" id="nudosRachas" placeholder="Ej. 24" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-sky-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Adjuntar captura de previsión</label>
                    <input type="file" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-sky-600 file:text-white hover:file:bg-sky-500 cursor-pointer">
                </div>
            </section>

            <!-- Material Disponible -->
            <section class="space-y-3">
                <h2 class="text-sm font-bold text-sky-300 uppercase tracking-wide">3. Tu Arsenal (Inventario)</h2>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Velas (Wings) disponibles</label>
                    <input type="text" id="alas" value="3m, 4m, 5m" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-sm focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Hidroalas (Foils) disponibles</label>
                    <input type="text" id="foils" value="Foil Grande (1700cm²), Foil Mediano" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-sm focus:outline-none focus:border-sky-500">
                </div>
            </section>

            <button onclick="calcularSetup()" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-black py-3 rounded-xl transition shadow-lg shadow-sky-500/20 uppercase tracking-wide">
                Calcular Setup Ideal
            </button>
        </main>

        <!-- Resultado -->
        <div id="resultado" class="mt-6 hidden bg-sky-950/80 border border-sky-500/50 p-5 rounded-2xl shadow-xl space-y-2">
            <h3 class="text-sm font-bold text-sky-400 uppercase tracking-wider">Configuración Recomendada</h3>
            <p id="textoRecomendacion" class="text-sm text-slate-200"></p>
        </div>
    </div>

    <script>
        function calcularSetup() {
            const peso = parseFloat(document.getElementById('peso').value) || 85;
            const nudos = parseFloat(document.getElementById('nudosMedios').value) || 15;
            const spot = document.getElementById('spot').value || 'tu spot';
            
            let velaRecomendada = "5m";
            if (nudos > 25) velaRecomendada = "3m";
            else if (nudos > 20) velaRecomendada = "4m";
            else if (nudos > 15) velaRecomendada = "5m o 4m";
            else velaRecomendada = "Vela grande / Foil XL";

            const resDiv = document.getElementById('resultado');
            const texto = document.getElementById('textoRecomendacion');
            
            texto.innerHTML = `Para <b>${spot}</b> con unos <b>${nudos} nudos</b> previstos y tu peso de <b>${peso} kg</b>, te recomendamos salir al agua con:<br><br>👉 <b>Wing:</b> ${velaRecomendada}<br>👉 <b>Foil:</b> Delantero de gran superficie (tipo XL) para asegurar bombeo y arrancada limpia.`;
            resDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
